version: '3.8'

services:
  atlantis:
    image: runatlantis/atlantis:latest
    container_name: atlantis-enterprise
    ports:
      - "4141:4141"
    environment:
      # GitHub Configuration
      ATLANTIS_GH_USER: ${ATLANTIS_GH_USER}
      ATLANTIS_GH_TOKEN: ${ATLANTIS_GH_TOKEN}
      ATLANTIS_GH_WEBHOOK_SECRET: ${ATLANTIS_GH_WEBHOOK_SECRET}
      
      # Repository Configuration
      ATLANTIS_REPO_ALLOWLIST: "github.com/mmparmar553/atlantis-production-setup"
      
      # Server Configuration
      ATLANTIS_ATLANTIS_URL: ${ATLANTIS_URL:-http://localhost:4141}
      ATLANTIS_PORT: 4141
      
      # AWS Configuration
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-west-2}
      
      # Enterprise Features
      ATLANTIS_ENABLE_POLICY_CHECKS: "true"
      ATLANTIS_ENABLE_DIFF_MARKDOWN_FORMAT: "true"
      ATLANTIS_LOG_LEVEL: "info"
      
      # Security Settings
      ATLANTIS_REQUIRE_APPROVAL: "true"
      ATLANTIS_REQUIRE_MERGEABLE: "true"
      
    volumes:
      - atlantis-data:/atlantis-data
      - ./config:/atlantis-config:ro
      - ~/.aws:/home/atlantis/.aws:ro
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4141/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  atlantis-data:
    driver: local
